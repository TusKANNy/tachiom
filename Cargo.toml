[package]
name = "tachiom"
version = "0.3.4"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python  = ["dep:pyo3", "dep:numpy"]
cli     = ["dep:clap", "dep:anyhow"]

[dependencies]
half        = { version = "2.4", features = ["serde", "std", "num-traits"] }
rustc-hash  = "2.1"
serde       = { version = "1.0", features = ["derive"] }
rand        = "0.8"
rayon       = "1.10"
anyhow      = { version = "1.0", optional = true }
clap        = { version = "4.3", features = ["derive"], optional = true }
ndarray     = "0.16"
ndarray-npy = "0.9"
pyo3        = { version = "0.24", features = ["extension-module"], optional = true }
numpy       = { version = "0.24", optional = true, features = ["half"] }
vectorium   = { git = "https://github.com/TusKANNy/vectorium.git", tag = "v0.3.0", features = ["multivec"] }
kannolo     = { git = "https://github.com/TusKANNy/kannolo.git", tag = "v0.6.1" }

[[bin]]
name = "tachiom_build"
path = "src/bin/tachiom_build.rs"
required-features = ["cli"]

[[bin]]
name = "tachiom_build_from_tac"
path = "src/bin/tachiom_build_from_tac.rs"
required-features = ["cli"]

[[bin]]
name = "tachiom_build_from_parts"
path = "src/bin/tachiom_build_from_parts.rs"
required-features = ["cli"]

[[bin]]
name = "tachiom_search"
path = "src/bin/tachiom_search.rs"
required-features = ["cli"]

[[bin]]
name = "bench_tac"
path = "src/bin/bench_tac.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 1
panic = "abort"
strip = "symbols"