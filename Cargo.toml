[package]
name = "tachiom"
version = "0.2.2"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python  = ["dep:pyo3", "dep:numpy"]

[dependencies]
half        = { version = "2.4", features = ["serde", "std", "num-traits"] }
rustc-hash  = "2.1"
serde       = { version = "1.0", features = ["derive"] }
rand        = "0.8"
rayon       = "1.10"
anyhow      = "1.0"
clap        = { version = "4.3", features = ["derive"] }
ndarray     = "0.16"
ndarray-npy = "0.9"
pyo3        = { version = "0.24", features = ["extension-module"], optional = true }
numpy       = { version = "0.24", optional = true, features = ["half"] }
vectorium   = { git = "https://github.com/TusKANNy/vectorium.git" }
kannolo     = { git = "https://github.com/TusKANNy/kannolo.git" }

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 1
panic = "abort"
strip = "symbols"